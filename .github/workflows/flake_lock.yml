name: update-flake
on:
  workflow_dispatch: # allows manual triggering
  pull_request: # triggers on every Pull Request
  schedule:
    - cron: '0 */3 * * *' # runs every hour

permissions:
  contents: write
  pull-requests: write


jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v1
      - name: Update flake.lock
        if: ${{ github.event_name != 'pull_request' }}
        uses: DeterminateSystems/update-flake-lock@main
        id: update
        with:
          path-to-flake-dir: '.'
          commit-msg: "chore(flake): bump flake"
          pr-title: "chore(flake): bump flake"
          git-author-name: 'Ruowen Qin'
          git-author-email: 'chinqrw@gmail.com'
      - name: Update tree-sitter cargoHash
        if: ${{ steps.update.outputs.pull-request-number != null }}
        run: |
          git checkout flake-lock-update-pr
          .github/scripts/update-cargo-hash.sh
          if git diff --quiet; then
            echo "No cargoHash changes needed"
          else
            git config user.name 'Ruowen Qin'
            git config user.email 'chinqrw@gmail.com'
            git add flake/packages/tree-sitter.nix
            git commit -m "chore: update tree-sitter cargoHash"
            git push
          fi
      - run: "gh pr merge --rebase ${{ steps.update.outputs.pull-request-number }}"
        if: ${{ steps.update.outputs.pull-request-number != null }}
        env:
          GH_TOKEN: ${{ github.token }}
